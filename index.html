<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<title>Cadence — Admission Progress</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/images/home.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cadence">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand-row">
      <div class="brand">
        <img src="/images/home.png" height="42" alt="Cadence" class="brand-logo"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'brand-mark',textContent:'C'}))">
        <div><b>CADENCE</b><span>ADMISSION TRACKER</span></div>
      </div>
      <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">×</button>
    </div>
    <nav>
      <button class="nav active" data-page="dashboard">Dashboard</button>
      <button class="nav" data-page="chapters">Chapters</button>
      <button class="nav" data-page="finals">Final Reviews</button>
      <button class="nav" data-page="mock">Full Mock</button>
      <button class="nav" data-page="exams">Exam Dates</button>
      <div class="nav-section-label">Progress &amp; Time</div>
      <button class="nav" data-page="progress">Study Streak &amp; Time</button>
      <button class="nav" data-page="settings">Settings</button>
    </nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header>
      <button class="icon-btn menu" id="menuBtn" aria-label="Menu">☰</button>
      <div class="mobile-brand">
        <img src="/images/home.png" alt="Cadence"
             onerror="this.style.display='none'"
             class="mobile-brand-logo">
        <span class="mobile-brand-name">CADENCE</span>
      </div>
      <div class="header-right">
        <span class="sync-pill" id="syncPill" data-status="idle" title="Cloud sync status">
          <i></i><span id="syncLabel">Ready</span>
        </span>
        <button class="icon-btn" id="themeBtn" title="Theme">◐</button>
      </div>
    </header>
    <section id="content"></section>
  </main>
</div>
<footer class="site-footer"><b>Cadence</b><span>Study consistently. Improve daily.</span><span>© 2026</span></footer>
<div class="toast" id="toast"></div>
<script>if(!localStorage.getItem('site_token'))location.replace('/login.html');</script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body></html>
