<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Cadence — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f8fc;--line:#e6e9ef;--line2:#d7dce2;
    --text:#202124;--muted:#6b7280;--accent:#1a73e8;--accent-soft:#e8f0fe;
    --danger:#d93025;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
    --ease:cubic-bezier(.22,.8,.22,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;min-height:100dvh;color:var(--text);
    font-family:"Manrope","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;
    display:grid;place-items:center;
    padding:calc(24px + var(--sat)) max(20px,env(safe-area-inset-right)) calc(24px + var(--sab)) max(20px,env(safe-area-inset-left));
    background:
      radial-gradient(60% 50% at 12% 8%,#e3edfe 0%,rgba(227,237,254,0) 70%),
      radial-gradient(55% 45% at 92% 96%,#e6f4ea 0%,rgba(230,244,234,0) 70%),
      var(--bg);
    background-attachment:fixed;
  }
  .card{
    width:100%;max-width:420px;background:#fff;border:1px solid var(--line);
    border-radius:26px;padding:36px 32px 30px;
    box-shadow:0 2px 4px rgba(32,33,36,.04),0 24px 64px rgba(32,33,36,.12);
    animation:rise .6s var(--ease) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .brand{display:flex;gap:14px;align-items:center;margin-bottom:28px}
  .logo{position:relative;width:52px;height:52px;border-radius:15px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(32,33,36,.06);flex-shrink:0;display:grid;place-items:center}
  .logo img{display:block;width:100%;height:100%;object-fit:cover;transform-origin:44.4% 45.9%;transform:translate(5.6%,4.1%) scale(1.5)}
  .logo-letter{width:100%;height:100%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800;font-size:20px}
  .brand b{display:block;letter-spacing:.11em;font-size:16px;font-weight:800;line-height:1.2}
  .brand span{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;margin-top:3px;font-weight:700}
  h1{font-size:26px;letter-spacing:-.03em;margin:0 0 6px;font-weight:800;line-height:1.2}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px;line-height:1.55}
  label{display:block;font-size:12.5px;font-weight:700;color:#3c4043;margin-bottom:7px}
  input{
    width:100%;min-height:50px;padding:0 15px;border:1px solid var(--line2);border-radius:14px;
    background:#f8fafc;font-size:16px;font-family:inherit;color:var(--text);outline:0;
    transition:border-color .18s,box-shadow .18s,background .18s;-webkit-appearance:none;appearance:none;
  }
  input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px rgba(26,115,232,.13)}
  .field{margin-bottom:16px}
  .pw{position:relative}
  .pw input{padding-right:72px}
  .pw-toggle{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;min-height:38px;padding:0 12px;
    border:0;border-radius:10px;background:transparent;color:var(--accent);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .pw-toggle:hover{background:var(--accent-soft)}
  .btn{
    width:100%;min-height:52px;margin-top:6px;border:0;border-radius:14px;color:#fff;
    background:linear-gradient(180deg,#2b7de9,#1a73e8);font:inherit;font-size:15px;font-weight:800;cursor:pointer;
    box-shadow:0 1px 2px rgba(26,115,232,.35),0 8px 20px rgba(26,115,232,.28),inset 0 1px 0 rgba(255,255,255,.18);
    transition:transform .15s var(--ease),box-shadow .2s,opacity .2s;touch-action:manipulation;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.65;cursor:not-allowed;transform:none}
  .hint{font-size:11.5px;color:var(--muted);margin-top:6px}
  .error{
    background:#fef2f2;border:1px solid #fecaca;color:var(--danger);
    padding:12px 14px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:16px;display:none;
  }
  .error.show{display:block}
  .footer-note{text-align:center;color:var(--muted);font-size:11.5px;margin-top:20px}
  .spinner{
    display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
    vertical-align:-2px;margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-state{text-align:center;padding:24px 0;color:var(--muted);font-size:13px;font-weight:600}
  .loading-state .big-spinner{
    display:inline-block;width:24px;height:24px;border:2.5px solid var(--line2);
    border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:12px;
  }
  @media(max-width:420px){.card{padding:28px 22px 24px;border-radius:24px}h1{font-size:24px}}
  @media(max-height:560px){body{place-items:start center}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo"><img src="/images/home.png" alt="Cadence"
         onerror="this.replaceWith(Object.assign(document.createElement('b'),{className:'logo-letter',textContent:'C'}))"></div>
    <div><b>CADENCE</b><span>ADMISSION TRACKER</span></div>
  </div>

  <div id="loadingView" class="loading-state">
    <div class="big-spinner"></div>
    <div>Connecting…</div>
  </div>

  <div id="authView" style="display:none">
    <h1 id="title">Sign in</h1>
    <p class="sub" id="subtitle">Welcome back. Enter your credentials to continue.</p>

    <div class="error" id="errorBox"></div>

    <form id="authForm" autocomplete="on" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               autocapitalize="off" autocorrect="off" spellcheck="false" required>
        <div class="hint" id="usernameHint" style="display:none">3–32 chars: a–z, 0–9, underscore</div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input id="password" name="password" type="password"
                 autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">Show</button>
        </div>
        <div class="hint" id="passwordHint" style="display:none">At least 4 characters</div>
      </div>
      <div class="field" id="confirmWrap" style="display:none">
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password">
      </div>
      <button type="submit" class="btn" id="submitBtn">Sign in</button>
    </form>

    <div class="footer-note">Personal use · One account per deployment</div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var errorBox = $('errorBox');
  var form = $('authForm');
  var submitBtn = $('submitBtn');
  var mode = 'login';

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function clearError() {
    errorBox.textContent = '';
    errorBox.classList.remove('show');
  }
  function setLoading(on) {
    submitBtn.disabled = on;
    if (mode === 'setup') {
      submitBtn.innerHTML = on ? '<span class="spinner"></span>Creating…' : 'Create account';
    } else {
      submitBtn.innerHTML = on ? '<span class="spinner"></span>Signing in…' : 'Sign in';
    }
  }

  function showAuthView() {
    $('loadingView').style.display = 'none';
    $('authView').style.display = '';
  }

  async function detectMode() {
    try {
      var res = await fetch('/api/auth/status', { cache: 'no-store' });
      if (!res.ok) throw new Error('bad status');
      var data = await res.json();

      if (data.needs_setup) {
        mode = 'setup';
        $('title').textContent = 'Create your account';
        $('subtitle').textContent =
          'First-time setup. Choose a username and password — you\'ll use these every time you sign in.';
        $('confirmWrap').style.display = '';
        $('usernameHint').style.display = '';
        $('passwordHint').style.display = '';
        $('password').setAttribute('autocomplete', 'new-password');
        submitBtn.textContent = 'Create account';
      } else {
        mode = 'login';
      }
      showAuthView();
    } catch (e) {
      showAuthView();
      showError('Cannot reach server. Check your connection and try again.');
    }
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearError();

    var username = $('username').value.trim().toLowerCase();
    var password = $('password').value;

    if (mode === 'setup') {
      var confirm = $('confirm').value;
      if (!/^[a-z0-9_]{3,32}$/.test(username)) {
        return showError('Username must be 3–32 chars: a–z, 0–9, _');
      }
      if (password.length < 4) {
        return showError('Password must be at least 4 characters');
      }
      if (password !== confirm) {
        return showError('Passwords do not match');
      }
    } else {
      if (!username || !password) {
        return showError('Enter your username and password');
      }
    }

    setLoading(true);
    try {
      var endpoint = mode === 'setup' ? '/api/auth/setup' : '/api/auth/login';
      var res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });
      var data = await res.json();

      if (!res.ok) {
        setLoading(false);
        return showError(data.error || 'Something went wrong');
      }

      localStorage.setItem('site_token', data.token);
      localStorage.setItem(
        'site_user',
        JSON.stringify({ id: data.user_id, username: data.username })
      );

      if (mode === 'setup') {
        localStorage.setItem('cadence_migrate_local', '1');
      }

      window.location.href = '/index.html';
    } catch (err) {
      setLoading(false);
      showError('Network error. Please try again.');
    }
  });

  $('pwToggle').addEventListener('click', function () {
    var pw = $('password');
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    this.textContent = show ? 'Hide' : 'Show';
    this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  detectMode();
})();
</script>
</body>
</html>
